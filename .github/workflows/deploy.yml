name: Deploy Backend Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Binary
        run: make linux-amd64

      - name: Prepare Artifact
        run: mv bin/ppanel-server-linux-amd64 "ppanel-server_${GITHUB_SHA}"

      - name: Upload Binary to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "ppanel-server_${{ github.sha }}"
          target: "/root/ppanel"

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -eu

            release_sha="${{ github.sha }}"
            app_root="/root/ppanel"
            candidate="${app_root}/ppanel-server_${release_sha}"
            current="${app_root}/ppanel-server"
            backup="${app_root}/.ppanel-server-backup-${release_sha}"

            cd "${app_root}"
            test -s "${candidate}"
            chmod +x "${candidate}"

            rm -f -- "${backup}"
            had_current=0
            if [ -f "${current}" ]; then
              cp -p -- "${current}" "${backup}"
              had_current=1
            fi

            rollback() {
              set +e
              docker-compose stop ppanel-service >/dev/null 2>&1 || true
              if [ "${had_current}" -eq 1 ] && [ -f "${backup}" ]; then
                mv -f -- "${backup}" "${current}"
                chmod +x "${current}"
              else
                rm -f -- "${current}"
              fi
              docker-compose up -d ppanel-service >/dev/null 2>&1 || true
            }

            if ! docker-compose stop ppanel-service; then
              exit 1
            fi

            if ! mv -f -- "${candidate}" "${current}"; then
              docker-compose up -d ppanel-service >/dev/null 2>&1 || true
              exit 1
            fi
            if ! docker-compose up -d ppanel-service; then
              rollback
              exit 1
            fi

            healthy=0
            for _ in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ppanel-service 2>/dev/null || true)"
              if [ "${status}" = "healthy" ]; then
                healthy=1
                break
              fi
              if [ "${status}" = "unhealthy" ]; then
                break
              fi
              sleep 3
            done

            if [ "${healthy}" -ne 1 ]; then
              rollback
              exit 1
            fi

            rm -f -- "${backup}"
